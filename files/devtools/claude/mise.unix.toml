[dotfiles]
"~/.claude/settings.json" = { source = "./settings.json", mode = "symlink" }
"~/.claude/statusline.sh" = { source = "./statusline.sh", mode = "symlink" }
"~/.claude/themes/" = { source = "./themes", mode = "symlink-each" }
"~/.claude/output-styles/" = { source = "./output-styles", mode = "symlink-each" }
"~/.claude/CLAUDE.md" = { source = "../agent/AGENTS.md", mode = "symlink" }
"~/.local/bin/clip-bridge" = { source = "./clip-bridge", mode = "symlink" }

[tasks.bootstrap]
description = "Install Claude Code agent bundle plugins and their dependencies"
run = """
claude plugin marketplace add ../agent/bundles >/dev/null 2>&1 || true

for plugin in agent-core creator developer matt-pocock platform researcher vanilla-green writing; do
  claude plugin install "${plugin}@zenobius-agent-bundles"
done
"""

[tasks."bootstrap-today"]
description = "TEMP: apply this bundle's local mise bootstrap config until conf.d folder fragments are released"
run = """
target="{{ config_root }}"
repo_root="$(git -C "$target" rev-parse --show-toplevel)"
empty_global="$(mktemp --suffix=.toml)"
ignored_roots="$repo_root/mise.toml:$repo_root/mise.unix.toml:$repo_root/mise.linux.toml:$repo_root/mise.windows.toml:$repo_root/mise.wsl2.toml"
trap 'rm -f "$empty_global"' EXIT

env MISE_AUTO_ENV=1 MISE_GLOBAL_CONFIG_ROOT= MISE_GLOBAL_CONFIG_FILE="$empty_global" MISE_IGNORED_CONFIG_PATHS="$ignored_roots${MISE_IGNORED_CONFIG_PATHS:+:$MISE_IGNORED_CONFIG_PATHS}" mise -C "$target" bootstrap --skip task
"""
