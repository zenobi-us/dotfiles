[dotfiles]
"~/.pi/agent/APPEND_SYSTEM.md" = { source = "./agent/APPEND_SYSTEM.md", mode = "symlink" }
"~/.pi/agent/extensions" = { source = "./agent/extensions", mode = "symlink" }
"~/.pi/agent/fzf.json" = { source = "./agent/fzf.json", mode = "symlink" }
"~/.pi/agent/package.json" = { source = "./agent/package.json", mode = "symlink" }
"~/.pi/agent/packages" = { source = "./agent/packages", mode = "symlink" }
"~/.pi/agent/pi-sub-bar-settings.json" = { source = "./agent/pi-sub-bar-settings.json", mode = "symlink" }
"~/.pi/agent/pi-sub-core-settings.json" = { source = "./agent/pi-sub-core-settings.json", mode = "symlink" }
"~/.pi/agent/settings.json" = { source = "./agent/settings.json", mode = "symlink" }
"~/.pi/agent/tsconfig.json" = { source = "./agent/tsconfig.json", mode = "symlink" }

[tasks."bootstrap-today"]
description = "TEMP: apply this bundle's local mise bootstrap config until conf.d folder fragments are released"
run = """
target="{{ config_root }}"
repo_root="$(git -C "$target" rev-parse --show-toplevel)"
empty_global="$(mktemp --suffix=.toml)"
ignored_roots="$repo_root/mise.toml:$repo_root/mise.unix.toml:$repo_root/mise.linux.toml:$repo_root/mise.windows.toml:$repo_root/mise.wsl2.toml"
trap 'rm -f "$empty_global"' EXIT

env MISE_AUTO_ENV=1 MISE_GLOBAL_CONFIG_ROOT= MISE_GLOBAL_CONFIG_FILE="$empty_global" MISE_IGNORED_CONFIG_PATHS="$ignored_roots${MISE_IGNORED_CONFIG_PATHS:+:$MISE_IGNORED_CONFIG_PATHS}" mise -C "$target" bootstrap --skip task
"""
