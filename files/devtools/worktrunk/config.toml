# Generated from ~/.pi/agent/pi-worktrees.config.json + Worktrunk tips/patterns
# https://worktrunk.dev/tips-patterns/#dev-server-per-worktree

# Match Pi worktreeRoot: {{mainWorktree}}.worktrees
worktree-path = "{{ repo_path }}/../{{repo}}.worktrees/{{ branch | sanitize }}"

[[pre-start]]
sync = ""

[[post-start]]
mise-trust = "mise trust -y; mise setup;"

[pre-remove]
# Stop per-worktree dev server port
server = "lsof -ti :{{ branch | hash_port }} -sTCP:LISTEN | xargs kill 2>/dev/null || true"

[commit]
stage = "all"

[commit.generation]
# Use pimono for commit message generation (reads rendered prompt from stdin)
command = "if command -v pimono >/dev/null 2>&1; then pimono; else printf 'chore: update\n'; fi"

[merge]
squash = true
commit = false
rebase = false

# ReckonOne monorepo: one rkn stack per worktree, frontend-only shape.
# Caddy serves <worktree-dir>.local.reckon.com; payroll runs as the vite dev
# server with HMR; web/apiv1/apiv2/gqlv1/gateway are the deployed dev services.
# This shape needs no AWS credentials once the local cert exists, so it is headless.
[projects."github.com/Reckon-Limited/reckonone-monorepo"]
# mise setup is repeated from the global post-start on purpose: project hooks
# append after global ones with no completion guarantee, and rkn needs mise's node.
# `preset load` writes stack.local.json and brings the stack up in one call.
post-start.stack = "mise trust -y && mise setup && rkn init && rkn preset load default-frontend"
# Without this the removed worktree leaves a registered stack, a caddy site and
# six held ports behind. Repair for a leak: `rkn stacks prune`.
pre-remove.stack = "rkn down"
# `rkn down` stops the stack but leaves its registry row behind, marked dead.
# prune is name-free and only touches stacks whose worktree is already gone.
post-remove.stack = "rkn stacks prune"
