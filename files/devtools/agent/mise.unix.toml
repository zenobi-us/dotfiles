[dotfiles]
"~/.claude/agents" = { source = "./agents", mode = "symlink" }
"~/.pi/agent/AGENTS.md" = { source = "./AGENTS.md", mode = "symlink" }
"~/.pi/agent/agents" = { source = "./agents", mode = "symlink" }
"~/.pi/agent/bundles" = { source = "./bundles", mode = "symlink" }
"~/.omp/agent/hooks/pre" = { source = "./bundles/agent-core/hooks/pre", mode = "symlink-each" }
"~/.omp/agent/hooks/pre/muxer-session.ts" = { source = "./bundles/developer/hooks/pre/muxer-session.ts", mode = "symlink" }
"~/.local/state/zot/extensions/agent-core" = { source = "./bundles/agent-core", mode = "symlink" }
"~/.local/state/zot/extensions/creator" = { source = "./bundles/creator", mode = "symlink" }
"~/.local/state/zot/extensions/developer" = { source = "./bundles/developer", mode = "symlink" }
"~/.local/state/zot/extensions/matt-pocock" = { source = "./bundles/matt-pocock", mode = "symlink" }
"~/.local/state/zot/extensions/platform" = { source = "./bundles/platform", mode = "symlink" }
"~/.local/state/zot/extensions/researcher" = { source = "./bundles/researcher", mode = "symlink" }
"~/.local/state/zot/extensions/writing" = { source = "./bundles/writing", mode = "symlink" }
"~/.agents/hooks/shared-context.json" = { source = "./bundles/agent-core/hooks/hooks.json", mode = "symlink" }
"~/.local/bin/shared-context" = { source = "./bundles/agent-core/skills/shared-context/scripts/shared-context/cli.ts", mode = "symlink" }

[tasks.bootstrap]
description = "Link OMP agent bundle plugins from source"
run = """
{% set bundles_dir = (config_root ~ "/bundles") | canonicalize %}
{% set marketplace_file = bundles_dir ~ "/.claude-plugin/marketplace.json" %}
bundles_dir={{ bundles_dir | quote }}
marketplace_file={{ marketplace_file | quote }}
marketplace="$(jq -r '.name' "$marketplace_file")"
installed_plugins="$(omp plugin list --json)"

jq -r '.plugins[].name' "$marketplace_file" |
while IFS= read -r plugin; do
  plugin_id="${plugin}@${marketplace}"
  if printf '%s\n' "$installed_plugins" |
    jq -e --arg id "$plugin_id" \
      'any(.marketplace[]?; .id == $id and .scope == "user")' >/dev/null
  then
    omp plugin uninstall --scope user "$plugin_id"
  fi
done

jq -r '.plugins[].source' "$marketplace_file" |
while IFS= read -r plugin_source; do
  omp plugin link --scope user "$bundles_dir/${plugin_source#./}"
done
"""
