[bootstrap.packages]
"apt:x11-xserver-utils" = "latest"
"dnf:xrdb" = "latest"

[bootstrap.repos]
"~/.config/nvim" = { url = "git@github.com:zenobi-us/astronvim.profile.git" }

[dotfiles]
"~/.config/wireplumber/wireplumber.conf.d/51-bluez-handsfree.conf" = { source = "windowmanagers/files/wireplumber/wireplumber.conf.d/51-bluez-handsfree.conf", mode = "copy" }
"~/.local/share/applications" = { source = "commands/files/applications", mode = "copy" }

[bootstrap.linux.systemd.units.clip-bridge]
description = "Convert WSLg's mirrored clipboard image (BI_BITFIELDS BMP) to PNG so Claude Code can paste it. No-ops outside WSL."
exec_start = "~/.local/bin/clip-bridge"
environment = { WAYLAND_DISPLAY = "wayland-0" }
restart = "on-failure"
restart_sec = "2s"
standard_output = "append:%h/.local/state/clip-bridge.log"
standard_error = "journal"
