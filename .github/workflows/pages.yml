name: Publish website

on:
  push:
    branches: [master]
    paths:
      - docs/website/**
      # The agent bundle pages read skills, agents, hooks and manifests from here.
      - mise/conf.d/devtools-agent/bundles/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: docs/website
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/website/dist/client
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
