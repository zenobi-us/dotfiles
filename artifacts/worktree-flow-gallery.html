  .aside { grid-area: aside; display: flex; flex-direction: column; justify-content: space-between; gap: 2rem; padding: clamp(1.35rem, 2.4vw, 2.5rem); border: var(--border-width, 1px) solid var(--stroke); background: var(--aside); }

  .plate[data-kind="lifecycle"] { grid-area: lifecycle; }
  .plate[data-kind="records"] { grid-area: records; }

    if (type === 'blob') return path(`M${X+W*.2} ${Y+4}C${X+W*.4} ${Y-10} ${X+W*.78} ${Y+8} ${X+W*.9} ${Y+4}C${X+W+14} ${Y+16} ${X+W+7} ${Y+H*.75} ${X+W*.9} ${Y+H-3}C${X+W*.55} ${Y+H+11} ${X+W*.2} ${Y+H+3} ${X+W*.1} ${Y+H-3}C${X-12} ${Y+H*.72} ${X-7} ${Y+H*.18} ${X+W*.2} ${Y+4}Z`);

  function svgWrap(id, title, viewBox, contents) {

  function ownership(v) {

    const nodes=node(v,31,38,195,54,'Phase-start')+node(v,31,138,195,54,'Phase-result')+node(v,31,238,195,54,'Phase-complete')+node(v,323,133,213,62,'events/ · append-only',true)+node(v,650,58,252,62,'Reviews + snapshots')+node(v,650,211,252,62,'Manifest + projections')+node(v,323,281,213,48,'Evidence ref');
