"~/.pi/agent/pi-sub-bar-settings.json" = { source = "devtools/pi/agent/pi-sub-bar-settings.json", mode = "symlink" }
"~/.pi/agent/pi-sub-core-settings.json" = { source = "devtools/pi/agent/pi-sub-core-settings.json", mode = "symlink" }
"~/.pi/agent/settings.json" = { source = "devtools/pi/agent/settings.json", mode = "symlink" }
"~/.pi/agent/tsconfig.json" = { source = "devtools/pi/agent/tsconfig.json", mode = "symlink" }
"~/.XresourceThemes" = { source = "shells/xresources/.XresourceThemes", mode = "symlink" }
"~/.Xresources" = { source = "shells/xresources/.Xresources", mode = "symlink" }
"~/.local/bin/llama-router" = { source = "devtools/llama-router/llama-router.sh", mode = "symlink" }

[env]
VISUAL = "nvim"
EDITOR = "nvim"
AGENT_BUNDLE_STORAGE_PATH_PATTERN = "$DOTFILE_REPO_ROOT/devtools/agent/bundles/{domain}/"
