"~/.zshenv" = { source = "shells/zsh/.zshenv", mode = "symlink" }
"~/.config/deskflow" = { source = "windowmanagers/deskflow", mode = "symlink" }
"~/.config/firefox-extensions/qr-code" = { source = "browsers/firefox/extensions/qr-code", mode = "copy" }
"~/.config/firefox-extensions/load-extensions.sh" = { source = "browsers/firefox/load-extensions.sh", mode = "copy" }
"~/.config/ghostty" = { source = "shells/ghostty", mode = "symlink" }
"~/.config/herdr/config.toml" = { source = "shells/herdr/config.toml", mode = "symlink" }
