"~/.pi/agent/AGENTS.md" = { source = "devtools/agent/AGENTS.md", mode = "symlink" }
"~/.pi/agent/APPEND_SYSTEM.md" = { source = "devtools/pi/agent/APPEND_SYSTEM.md", mode = "symlink" }
"~/.pi/agent/agents" = { source = "devtools/agent/agents", mode = "symlink" }
"~/.pi/agent/bun.lock" = { source = "devtools/pi/agent/bun.lock", mode = "symlink" }
"~/.pi/agent/bundles" = { source = "devtools/agent/bundles", mode = "symlink" }
"~/.pi/agent/extensions" = { source = "devtools/pi/agent/extensions", mode = "symlink" }
"~/.pi/agent/fzf.json" = { source = "devtools/pi/agent/fzf.json", mode = "symlink" }
