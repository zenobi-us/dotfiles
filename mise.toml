[env]
PI_SUBAGENT_MUX = "zellij"
PI_SUBAGENT_ZELLIJ_PLACEMENT = "right-stack"

[shell_alias]
pi="mise x node@lts -- pi --no-skills"
piupdate="mise x node@lts -- pi update"
piinstall="mise x node@lts -- pi install"

[bootstrap.repos]
"~/Projects/dotfiles" = { url = "git@github.com:zenobi-us/dotfiles.git", ref = "master" }

[bootstrap.hooks]
pre-dotfiles = """
if [ -L "$HOME/.config/mise" ] && [ "$(readlink "$HOME/.config/mise")" = "$PWD/devtools/files/mise" ]; then
  rm "$HOME/.config/mise"
  mkdir -p "$HOME/.config/mise"
fi
"""

[dotfiles]
"~/.bunfig.toml" = { source = "devtools/files/bun/bunfig.toml", mode = "symlink" }
"~/.config/mise/config.toml" = { source = "mise.toml", mode = "symlink" }
"~/.config/mise/tasks" = { source = "devtools/files/mise/tasks", mode = "symlink" }
"~/.gitconfig" = { source = "devtools/files/git/.gitconfig", mode = "copy" }
"~/.gitignore_global" = { source = "devtools/files/git/.gitignore_global", mode = "copy" }
"~/.config/starship.toml" = { source = "shells/files/starship/starship.toml", mode = "copy" }

[tasks.bootstrap]
description = "Finish machine setup after declarative bootstrap phases"
run = """
set -euo pipefail
git submodule update --init --recursive
git config --global core.excludesFile "$HOME/.gitignore_global"
if [ -d devtools/files/pi/agent ]; then
  (cd devtools/files/pi/agent && bun install)
fi
case "$(uname -s)" in
  Linux) mise run bootstrap:linux ;;
  Darwin) mise run bootstrap:macos ;;
esac
"""
run_windows = [
  "git submodule update --init --recursive",
  "git config --global core.excludesFile $HOME/.gitignore_global",
  "if (Test-Path devtools/files/pi/agent) { Push-Location devtools/files/pi/agent; bun install; Pop-Location }",
  "mise run bootstrap:windows",
]

[tasks."bootstrap:linux"]
description = "Linux-only bootstrap leftovers"
run = """
set -euo pipefail
font-install -fromFile assets/files/fonts.txt
chmod +x "$HOME/.config/firefox-extensions/load-extensions.sh" 2>/dev/null || true
if command -v xrdb >/dev/null && [ -f "$HOME/.Xresources" ]; then
  xrdb -merge "$HOME/.Xresources"
fi
"""

[tasks."bootstrap:macos"]
description = "macOS-only bootstrap leftovers"
run = """
set -euo pipefail
font-install -fromFile assets/files/fonts.txt
chmod +x "$HOME/.config/firefox-extensions/load-extensions.sh" 2>/dev/null || true
"""

[tasks."bootstrap:windows"]
description = "Windows setup that mise bootstrap cannot model natively yet"
run_windows = [
  "if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) { irm get.scoop.sh | iex }",
  "winget install -e --id Git.Git --accept-source-agreements --accept-package-agreements",
  "winget install -e --id Microsoft.PowerShell --accept-source-agreements --accept-package-agreements",
  "winget install -e --id jdx.mise --accept-source-agreements --accept-package-agreements",
  "winget install -e --id Microsoft.OpenSSH.Beta --accept-source-agreements --accept-package-agreements",
  "winget install -e --id ShareX.ShareX --accept-source-agreements --accept-package-agreements",
  "winget install -e --id GnuPG.Gpg4win --accept-source-agreements --accept-package-agreements",
  "winget install -e --id Starship.Starship --accept-source-agreements --accept-package-agreements",
  "winget install -e --id AutoHotkey.AutoHotkey --accept-source-agreements --accept-package-agreements",
  "winget install -e --id jstarks.npiperelay --accept-source-agreements --accept-package-agreements",
  "scoop bucket add younger-1_scoop-it https://github.com/younger-1/scoop-it",
  "scoop install sudo fzf psfzf uni llvm 7zip tar git-credential-gopass",
  "Install-Module -Name Emojis -Scope CurrentUser -Force -AcceptLicense",
  "Get-AppxPackage Microsoft.XboxGamingOverlay | Remove-AppxPackage",
  "Get-Service ssh-agent | Set-Service -StartupType Automatic -PassThru | Start-Service",
  "if (-not (wsl -l -q | Select-String '^Ubuntu$')) { wsl --install -d Ubuntu --no-launch }",
  "wsl --set-default-version 2",
  "wsl -d Ubuntu --user root -- apt update -y",
  "wsl -d Ubuntu --user root -- apt install -y wslu socat",
]
