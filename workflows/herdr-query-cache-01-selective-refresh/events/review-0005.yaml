t,ref: workflows/herdr-query-cache-01-selective-refresh/events/review-start-0004.yaml},{kind: ticket,ref: tracker/tickets/herdr-query-cache-01-selective-refresh.md},{kind: initiative,ref: tracker/initiatives/herdr-query-cache/index.md},{kind: receipt,ref: workflows/herdr-query-cache-01-selective-refresh/events/implementation-0002.yaml},{kind: context,ref: workflows/herdr-query-cache-01-selective-refresh/artifacts/evidence/implementation-0002/index.md}],outputs: [{kind: review,ref: workflows/herdr-query-cache-01-selective-refresh/artifacts/reviews/review-review-0005.md},{kind: receipt,ref: workflows/herdr-query-cache-01-selective-refresh/events/review-0005.yaml}],findings: [{blocking_reason: The implementation violates the explicit resource bound and loses deletion protection during normal long-lived multi-panel use. Static evidence; no tests were run.,evidence: "Each distinct removed entry adds a key to this.retired. Neither persist(), eviction, nor release() removes these keys. Only the serialized copy is limited to MAX_CELLS. Repeated additions and removals therefore grow memory and every persistence merge without limit. The serialized cap also drops older deletion protection: after more than 128 other retirements, a separate client that still holds an older removed body can persist it again because lines 119-122 no longer find its retirement timestamp.",file: mise/conf.d/devtools-herdrapp/app/mods/shared-context/data.js,id: STD-01,line: "91,107,117-124",required_change: "Use bounded retirement bookkeeping with a durable generation or equivalent fence that rejects writes from older client snapshots. Do not fix the memory leak by merely truncating this.retired, which would preserve the stale-client resurrection path.",requirement: "Ticket: 'Memory and disk caches remain bounded.' Also: 'Prevent late reads or validation responses from restoring deleted records or replacing newer cache state.'",severity: P2,validation_command: mise exec -- node --experimental-vm-modules --test mise/conf.d/devtools-herdrapp/tests/cells.test.mjs,validation_expectation: "Add regressions that retire more than MAX_CELLS distinct records, assert bounded in-memory bookkeeping, and then persist from an older concurrent client. A fresh client must not recover the removed body.",axis: Standards,adr_reference: NO ADR,blocking: true},{evidence: "follow() clears filePreview and fileEntries, then restores only context and tracker through peek(). Saved fileFolders and fileSelection are restored only after await client.validate(where) and the context query. loadFolder()/openFile() also await query() before applying their bodies. Therefore reopening a warm Files panel displays neither its cached directory listings nor its cached selected-file content while validation is pending, although QueryClient restored both from storage.",file: mise/conf.d/devtools-herdrapp/app/mods/shared-context/main.js,id: SPEC-01,line: "139-140, 193-216",required_change: "Restore saved file selection and expanded folders from the cached context identity, populate their displayed bodies through peek(), and label them stale before starting validation. Retain the existing target/generation checks and removal handling.",requirement: "On connection or refresh, show cached data as stale until validation succeeds.",severity: P2,validation_command: mise exec -- bun --cwd mise/conf.d/devtools-herdrapp run test,validation_scenario: "Add a panel-level regression: persist an expanded directory and selected preview, recreate the Files view, delay the validation response, and assert that both cached bodies remain visible and stale before resolving validation. Then check changed and removed classifications.",why_blocking: The required stale-first presentation is missing for directory and file queries. The cache-client tests exercise peek() directly but do not prove that the Files panel displays these cached bodies.,axis: Spec,adr_reference: NO ADR,blocking: true}],validation_results: [{check: Exact 