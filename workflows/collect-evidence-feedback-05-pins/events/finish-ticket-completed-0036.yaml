vidence]\\nadapter = \"files\"\\nstore = \"repository\"\\n');\n  const working=join(directory,'working');\n  const run=await invoke(collector,['init',working,'--repository',repository,'--workflow','pins-smoke','--run','source','--driver','playwright']);\n  await writeFile(join(working,'plan.ts'),'export const plan = '+JSON.stringify({schema:'collect-evidence/v1',kind:'plan',workId:'pins-smoke',driver:'playwright',base:page.url.origin,approval:{origins:[page.url.origin],confirmations:[]},tests:[{id:'original',claim:'Preserve original pixels',pass:'Heading exists',fail:'Heading missing',steps:[{do:'navigate',says:'Open owned page',to:'/',shot:''},{do:'expect',says:'Inspect heading',locator:'h1',text:'Annotation integration smoke',shot:'original'}]}]})+';');\n  for (const step of ['render','compile','run']) await invoke(collector,[step,working]);\n  const imported=await invoke(cli,['init',run.destination.path,'--repository',repository,'--workflow','pins-smoke','--session','review']);\n  const session=imported.destination.path;\n  const reserve=Bun.serve({hostname:'127.0.0.1',port:0,fetch:()=>new Response()}); const port=reserve.port; await reserve.stop(true);\n  server=await start(session,port);\n  const origin=`http://127.0.0.1:${port}`;\n  const state=await (await fetch(origin+'/api/v1/session')).json();\n  const cases=await (await fetch(origin+'/api/v1/cases')).json();\n  const asset=cases.cases[0].assets[0];\n  const input={schema:'collect-feedback/v1',kind:'annotation',id:crypto.randomUUID(),sessionId:'review',caseId:'original',assetId:asset.id,sourceSha256:asset.sha256,originalWidth:asset.width,originalHeight:asset.height,geometry:{x:0.5,y:0.5,width:0,height:0},priority:'P2',comment:'Integration smoke durable note'};\n  const saved=await fetch(origin+'/api/v1/annotations',{method:'POST',headers:{Origin:origin,'X-Write-Token':state.writeToken,'Content-Type':'application/json'},body:JSON.stringify(input)});\n  if(saved.status!==201)throw Error('Annotation save failed: '+saved.status+' '+await saved.text());\n  const record=await saved.json();\n  server.kill('SIGTERM'); if(await server.exited!==0)throw Error('Server shutdown failed'); server=undefined;\n  const exported=await invoke(cli,['export',session]);\n  const note=exported.annotations.find(note=>note.id===input.id);\n  if(!note||note.comment!==input.comment||note.sourceSha256!==asset.sha256)throw Error('Durable export did not preserve note identity');\n  console.log(JSON.stringify({scenario:'installed annotation save then offline export',saved_id:note.id,comment:note.comment,sourceSha256:note.sourceSha256,server_exit:0}));\n} finally {\n  if(server){server.kill('SIGTERM');await server.exited;}\n  await page.stop(true);\n  await command('chmod',['-R','u+rwX',directory]);\n  await rm(directory,{recursive:true,force:true});\n}\nasync function command(executable,args){const p=Bun.spawn([executable,...args],{cwd:directory,stdout:'pipe',stderr:'pipe'});const [out,err]=await Promise.all([new Response(p.stdout).text(),new Response(p.stderr).text()]);if(await p.exited!==0)throw Error(executable+' failed: '+out+err);return out;}\nasync function invoke(executable,args){return JSON.parse(await command(executable,[...args,'--json','--no-color','--no-input']));}\nasync function start(session,port){const p=Bun.spawn([cli,'serve',session,'--port',String(port),'--json'],{cwd:directory,stdout:'pipe',stderr:'pipe'});const reader=p.stdout.getReader();let text='';while(!text.includes('\\n')){const next=await reader.read();if(next.done)throw Error('Service exited before readiness');text+=new TextDecoder().decode(next.value);}reader.releaseLock();if(!JSON.parse(text.trim()).success)throw Error('Service not ready');return p;}\n"],cwd: /run/media/zenobius/Store/Projects/Mine/Github/Dotfiles.worktrees/integration-e2dd4caf-9506-42b0-bbed-5b77118379f6,exit_code: 0,output: "{\"scenario\":\"installed annotation save then offline export\",\"saved_id\":\"01bbfe11-cce1-4bce-a9d8-addca497aa87\",\"commen