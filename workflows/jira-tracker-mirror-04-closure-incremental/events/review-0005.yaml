-herdrapp/app/mods/shared-context/data.ts,line: 103,description: "The Tracker pane calls loadExplorerSnapshot(context, exec) without a diagnostics sink (data.ts:103, :145, :159). The unscoped strict load throws on a blocker loop; the live mirror has 27 loops. The uncommitted base workflow.ts change keeps the throw for unscoped strict loads.",required_change: "Pass a diagnostics sink in the mod, show cycle diagnostics as warnings, and draw the graph. Add a mod test with a two-ticket loop.",validation_command: mise exec -- bun test tests (in mise/conf.d/devtools-herdrapp/app)},{id: F5,severity: major,adr: NO ADR,file: workflows/jira-tracker-mirror-04-closure-incremental/artifacts/snapshots,line: 1,description: "No herdr-app shot capture of the reckonone Tracker pane with epics, a blocker graph, and a loop warning exists.",required_change: "After F1-F4, capture the pane with herdr-app shot and store it as workflow evidence.",validation_command: "Evidence file exists and shows epics, blocker graph, and loop warning"}],non_blocking_notes: ["N1 jira-mirror.ts:209: key in (...) with a deleted or hidden key can make Jira reject the whole batch JQL and fail the sync. Plausible, not confirmed.","N2 jira-mirror.ts:222: incremental children query of a mirrored epic uses the time filter; adding children to mirror.closure later misses old children until --full. Document it.","N3 jira-mirror.ts:233: mirrored blockers are refreshed only in round 0.","N4 jira-mirror.ts:121: incremental sync treats stale files as mirrored nodes.","N5 jira-mirror.ts:162: --key result reports queries: [] although the file keeps its query names."],review_base_commit: 5eae0ebeb765aa3e1fb9732402f447715757f8e2,changed_scope: [mise/conf.d/devtools-agent/bundles/matt-pocock/skills/reading-and-writing-tickets/scripts/jira-mirror.ts,mise/conf.d/devtools-agent/bundles/matt-pocock/skills/reading-and-writing-tickets/scripts/jira-mirror.test.ts,mise/conf.d/devtools-agent/bundles/matt-pocock/skills/reading-and-writ