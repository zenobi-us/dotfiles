kind: receipt,ref: workflows/herdr-context-panels/events/review-0008.yaml}],review_fixed_point: e31985e76c5f3bdc0a6223c82248321f447f6ec0,recovery_mode: takeover,authorization: User-approved present-day verification and retrospective independent review of published work. Parent review-start-0007 authorizes this fresh review; no historical review is asserted.,created_at: 2026-11-11T22:14:38.698Z,status: completed,verdict: FAILURE,artifact_ref: workflows/herdr-context-panels/artifacts/reviews/review-review-0008.md,review_artifact: workflows/herdr-context-panels/artifacts/reviews/review-review-0008.md,findings: [{adr: NO ADR,category: correctness,description: "[INFERENCE from source] Context refresh reloads only collection roots. Expanded descendant directories retain stale fileEntries. After a settings reload, fileFolders is restored but fileEntries is empty, so those descendants appear expanded with no children. The user must close and reopen each descendant to load its contents.",file: mise/conf.d/devtools-herdrapp/app/mods/shared-context/main.js,id: S-001,line: 111,required_change: Reload every retained expanded directory during Context refresh and state restoration. Keep the existing repository-generation guards.,severity: medium,validation: Expand a collection and a nested directory. Change that directory on disk and select Refresh; verify its children update. Reload the mod through Better Config and verify the expanded descendants still show their children. Parent must run these native scenarios; this review did not run the app.},{adr: NO ADR,criterion: "Show initiatives, ticket dependency trees, shared prerequisite links, queues, record details, and workflow events from canonical data.",description: "The current tree renders initiative members at one depth and gives every ticket children: 0. It never traverses blockedBy. Its reference markers represent repeated initiative membership, not shared prerequisite paths. Dependency graphs and detail links exist, but they replace the requested dependency tree. The supplied c2-alpha.png confirms base, alpha and beta are siblings. The original implementation at 54ae8fda traversed blockers and emitted shared references.",end_line: 23,file: mise/conf.d/devtools-herdrapp/app/mods/shared-context/tree.js,id: P-001,line: 15,required_change: "Restore expandable dependency paths and shared prerequisite references in the compact tree used by C and C2. Keep the graph as an additional view, not the only dependency hierarchy.",severity: P2,validation: "Use alpha and beta blocked by base. Verify dependency nesting, a shared reference to base, reference navigation, and identical tree behavior in C and C2. No new checks were run during this read-only review."},{adr: NO ADR,criterion: Preserve selection per repository. Discard stale responses.,description: "After awaiting prepare, launchAction checks only whether the captured pane still exists. It does not check the panel revision, current repository, or selected record. follow() and choose() can clear the action menu while preparation remains pending, but the old response still reaches pane.split. [INFERENCE] Switching repositories or records during preparation can therefore launch an obsolete action after the originating selection has disappeared. Canonical record revalidation does not validate the current GUI selection.",end_line: 22,file: mise/conf.d/devtools-herdrapp/app/mods/shared-context/action.js,id: P-002,line: 18,related_criterion: Keep setup and fresh-chat actions explicit. Revalidate action inputs before launch.,required_change: "Bind launch preparation to an action generation and repository/record identity. Invalidate it on repository or record changes and discard obsolete results before pane.split, including stale error/state updates.",severity: P2,validation: "Delay a real preparation request, switch repository or record, then release it. Verify that no pane opens and the new selection receives no old error. Also verify unchanged selection still opens one fresh session. This ordering was not exercised in the supplied evidence."},{adr: NO ADR,criterion: Preserve selection per repository. Discard stale responses.,description: "openFile captures the selected collection/path and checks it on success, but its catch checks only the repository revision. If preview A fails after the user selects B, A's error enters the panel-wide error banner. B's successful response does not clear it. The current file can therefore display a stale error, including an obsolete binary, size-limit, or missing-file error. This same-repository ordering is not covered by the supplied cross-repository checks.",file: mise/conf.d/devtools-herdrapp/app/mods/shared-context/main.js,id: P-003,line: 185,required_change: Apply the current file-request identity guard to failure responses as well as successful previews. Use a monotonically increasing preview request generation so repeated selections of the same path cannot revive old responses.,severity: P2,validation: "Delay a failing preview A, select readable B, complete B, then release A. Verify B remains visible without A's error. Check A-to-B-to-A ordering as well. No runtime check was run during this review."}],validation_results: [{command: node --experimental-vm-modules /tmp/herdr-review-state-smoke.mjs,exit_code: 0,result: "S-001 reproduced: expanded alignment:nested retained; only root directory requested; nested entries absent."},{command: node --experimental-vm-modules /tmp/herdr-review-races.mjs,exit_code: 0,result: "P-001 reproduced: base/alpha/beta all depth 1, children 0, reference null. P-002 reproduced: after selection/repository switch to /B, obsolete /A preparation invoked captured pane.split. P-003 reproduced: B body remains current while obsolete A error sets panel banner."},{command: Independent SHA-256 comparison of retained native source bindings,result: 17/17 current modules equal evidence and private-copy hashes; managed CLI layout hash matches.}],axis_res