<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" width="1280" height="860">
<style>text { font-family: "JetBrains Mono", "Fira Code", "SF Mono", monospace; font-size: 14px; white-space: pre; }</style>
<rect width="100%" height="100%" fill="rgb(0,0,0)"/>
<text x="10" y="44" fill="rgb(255,255,255)">                                                      ████████████</text>
<text x="10" y="64" fill="rgb(255,255,255)">   ╭───────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────╮</text>
<text x="10" y="84" fill="rgb(255,255,255)">   │ Projects · Repo &gt; Dotfiles                                                                                                        │</text>
<text x="10" y="104" fill="rgb(255,255,255)">   │  [1 Tracker]     2 Files    Tab focus · Space/Enter activate                                                                      │</text>
<text x="10" y="124" fill="rgb(255,255,255)">   │ Initiatives  &gt;  artifact-share: one git store, many pub  &gt;  Description                                                           │</text>
<text x="10" y="144" fill="rgb(255,255,255)">   │&gt; artifact-share: one git store, many publish targets · Description                                                                │</text>
<text x="10" y="164" fill="rgb(255,255,255)">   │                                                                                                                                   │</text>
<text x="10" y="184" fill="rgb(255,255,255)">   │  ```                                                                                                                              │</text>
<text x="10" y="204" fill="rgb(255,255,255)">   │                                                                                                                                   │</text>
<text x="10" y="224" fill="rgb(255,255,255)">───│  Rename the skill from `artifact-shares` to `artifact-share`.                                                                     │────</text>
<text x="10" y="244" fill="rgb(255,255,255)"> Up│                                                                                                                                   │</text>
<text x="10" y="264" fill="rgb(255,255,255)"> Ne│  ## User Stories                                                                                                                  │</text>
<text x="10" y="284" fill="rgb(255,255,255)">───│                                                                                                                                   │────</text>
<text x="10" y="304" fill="rgb(255,255,255)">   │  1. As a user, I want to publish a share to every target of a store with one                                                      │</text>
<text x="10" y="324" fill="rgb(255,255,255)">───│     `share` command.                                                                                                              │ ⟲ ─</text>
<text x="10" y="344" fill="rgb(255,255,255)">❯  │  2. As a user, I want to publish a store to an S3 bucket and get a CloudFront URL                                                 │</text>
<text x="10" y="364" fill="rgb(255,255,255)">───│     back.                                                                                                                         │────</text>
<text x="10" y="384" fill="rgb(255,255,255)"> ◑ │  3. As a user, I want to publish a store to a WebDAV server or an ssh host.                                                       │</text>
<text x="10" y="404" fill="rgb(255,255,255)">   │  4. As a user, I want a redacted share to disappear from every target.                                                            │</text>
<text x="10" y="424" fill="rgb(255,255,255)">   │  5. As a user, I want to list my stores and targets in one TOML file under my XDG                                                 │</text>
<text x="10" y="444" fill="rgb(255,255,255)">   │     config directory.                                                                                                             │</text>
<text x="10" y="464" fill="rgb(255,255,255)">   │  6. As a user, I want to keep a store local only, with no remote and no targets.                                                  │</text>
<text x="10" y="484" fill="rgb(255,255,255)">   │                                                                                                                                   │</text>
<text x="10" y="504" fill="rgb(255,255,255)">   │  ## Implementation Decisions                                                                                                      │</text>
<text x="10" y="524" fill="rgb(255,255,255)">   │                                                                                                                                   │</text>
<text x="10" y="544" fill="rgb(255,255,255)">   │  - The store is always a git repository. The publish step is the only part that                                                   │</text>
<text x="10" y="564" fill="rgb(255,255,255)">   │    changes for each target type.                                                                                                  │</text>
<text x="10" y="584" fill="rgb(255,255,255)">   │  - Every target receives the Fumapress build, not the bare `public/s/&lt;hash&gt;/`                                                     │</text>
<text x="10" y="604" fill="rgb(255,255,255)">   │    files.                                                                                                                         │</text>
<text x="10" y="624" fill="rgb(255,255,255)">   │  - `share` and `redact` commit, then publish to every target of the store.                                                        │</text>
<text x="10" y="644" fill="rgb(255,255,255)">   │    `publish &lt;store&gt; [--target N]` re-syncs without a new share.                                                                   │</text>
<text x="10" y="664" fill="rgb(255,255,255)">   │  - A `github-pages` target requires a GitHub remote. `doctor` refuses a store                                                     │</text>
<text x="10" y="684" fill="rgb(255,255,255)">   │    that has a `github-pages` target and no remote.                                                                                │</text>
<text x="10" y="704" fill="rgb(255,255,255)">   │  - Non-GitHub targets build the site locally. `BASE_PATH` comes from the path of                                                  │</text>
<text x="10" y="724" fill="rgb(255,255,255)">   │    the target's `public_url`, so each target gets its own build.                                                                  │</text>
<text x="10" y="744" fill="rgb(255,255,255)">   │                                                                                                                                   │</text>
<text x="10" y="764" fill="rgb(255,255,255)">   │ [Return]  [PgUp] [PgDn]                                                                                                           │</text>
<text x="10" y="784" fill="rgb(255,255,255)">   │↑↓ scroll · PgUp/Dn page · Esc return                                                                                              │</text>
</svg>
