{status: FINISHED,inputs: [{kind: receipt,ref: workflows/skill-contract-manifests-09-evidence/events/finish-worktree-removed-0019.yaml},{kind: review,ref: workflows/skill-contract-manifests-09-evidence/artifacts/reviews/review-review-0011.md}],outputs: [{kind: receipt,ref: workflows/skill-contract-manifests-09-evidence/events/finish-0020.yaml},{kind: integration-result,ref: workflows/skill-contract-manifests-09-evidence/artifacts/snapshots/integration-result-0016.json},{kind: cleanup,ref: workflows/skill-contract-manifests-09-evidence/artifacts/snapshots/cleanup-result-0019.json},{kind: ticket,ref: tracker/tickets/skill-contract-manifests-09-evidence.md}],integration_method: squash,reviewed_source_commit: 62f26327084f0dca065ee8ec065c0437cdc54c7d,reviewed_source_tree: d802a953960f01c104a02959652453b55cc37201,base_before: 772ac8c2aa6e801e9b61ca38c169ef95283e8593,expected_merge_tree: 1918805705f83879f8e12598739cfc7661771399,merged_commit: 0df154b1564fbc7d393ccc913192f73daf8e394c,merged_tree: 1918805705f83879f8e12598739cfc7661771399,merged_parents: [772ac8c2aa6e801e9b61ca38c169ef95283e8593],validation_results: [{argv: [wt,"-C",/run/media/zenobius/Store/Projects/Mine/Github/Dotfiles.worktrees/integration-25ebc078-060c-4dff-a84b-06c0b5971b15,hook,pre-merge,"--var",target=master,"--var",target_worktree_path=/run/media/zenobius/Store/Projects/Mine/Github/Dotfiles],cwd: /run/media/zenobius/Store/Projects/Mine/Github/Dotfiles.worktrees/integration-25ebc078-060c-4dff-a84b-06c0b5971b15,exit_code: 0,output: "",source_commit: 0df154b1564fbc7d393ccc913192f73daf8e394c,source_tree: 1918805705f83879f8e12598739cfc7661771399},{argv: [mise,exec,"--",env,PLAYWRIGHT_MCP_EXECUTABLE_PATH=/home/zenobius/.cache/ms-playwright/chromium-1243/chrome-linux64/chrome,bun,test,mise/conf.d/devtools-agent/bundles/developer/skills/browsers/collect-evidence/scripts/browser-evidence/test,mise/conf.d/devtools-agent/bundles/developer/skills/browsers/collect-feedback/scripts/collect-feedback/test,mise/conf.d/devtools-agent/bundles/developer/skills/devtools/writing-reports/scripts/test/report-cli.test.ts],cwd: /run/media/zenobius/Store/Projects/Mine/Github/Dotfiles.worktrees/integration-25ebc078-060c-4dff-a84b-06c0b5971b15,exit_code: 0,output: "bun test v1.4.4 (38afee6c8)\n",source_commit: 0df154b1564fbc7d393ccc913192f73daf8e394c,source_tree: 1918805705f83879f8e12598739cfc7661771399},{argv: [mise/conf.d/devtools-agent/bundles/agent-core/skills/skill-contracts/scripts/router.ts,validate,"--skill",mise/conf.d/devtools-agent/bundles/developer/skills/browsers/collect-evidence],cwd: /run/media/zenobius/Store/Projects/Mine/Github/Dotfiles.worktrees/integration-25ebc078-060c-4dff-a84b-06c0b5971b15,exit_code: 0,output: "{\n  \"manifest\": {\n    \"schemaVersion\": \"skill-contract-manifest/v1\",\n    \"produces\": [\n      \"collect-evidence/v2\"\n    ],\n    \"accepts\": [\n      \"collect-evidence/v2\",\n      \"collect-evidence/v1\"\n    ],\n    \"contracts\": {\n      \"collect-evidence/v2\": \"file:references/evidence-schema.md\",\n      \"collect-evidence/v1\": \"file:references/evidence-v1.md\"\n    },\n    \"upgrades\": []\n  },\n  \"definitions\": {\n    \"collect-evidence/v2\": {\n      \"reference\": \"file:references/evidence-schema.md\",\n      \"path\": \"/run/media/zenobius/Store/Projects/Mine/Github/Dotfiles.worktrees/integration-25ebc078-060c-4dff-a84b-06c0b5971b15/mise/conf.d/devtools-agent/bundles/developer/skills/browsers/collect-evidence/references/evidence-schema.md\",\n      \"content\": \"---\\nschemaVersion: collect-evidence/v2\\nkind: contract\\n---\\n# Common evidence contract\\n\\nEvery first-party JSON file and JSONL record uses schemaVersion collect-evidence/v2 and a kind. Owned Markdown has the same schemaVersion in frontmatter. Preserve tool-native bytes under native/.\\n\\n| Kind | Authoritative content |\\n|---|---|\\n| run | Stable run ID, sealed status, actual collection interval, driver provenance, ordered cases and file inventory hashes. |\\n| plan | The authored typed Plan in data. Consumers do not execute the preserved plan.ts. |\\n| case | Stable case ID, purpose, preconditions, ordered steps, expectations, observations, assets, errors and limits. |\\n| asset | Stable capture ID, case and step references, increasing sequence, descriptive media path, actual SHA-256, dimensions, media type, capture time and driver provenance. |\\n| event | Ordered observations, assertionResult, captureStatus and registered asset references. |\\n| error | Explicit assertion, capture, blocked or operation failure. |\\n\\n## Layout\\n\\nA run has run.json, plan.ts, plan.json and index.md. Each cases/<id>/ directory has case.json, index.md, events.jsonl and media/. Asset and error records are embedded in case.json. Preserve native scripts, workflows, logs, original screenshots and recordings under native/.\\n\\nImages use actual PNG bytes. WebM recordings have scope case and a sourcePath for the preserved native file. Duration, viewport and capture time can be null when the source did not record them. Do not substitute file modification time or import time. Asset hashes identify the exact source bytes.\\n\\n## Results\\n\\nCapture status is captured, failed or not-requested. Assertion results are passed, failed, not-run or not-applicable. Only an executed expect with assertionPassed true establishes a passing assertion. A captured image, process exit or successful cleanup is not an assertion.\\n\\nPASS requires completed steps, executed passing assertions and image evidence. FAIL records an actual failure. BLOCKED identifies an unmet prerequisite or safety stop. PARTIAL records missing proof or human work. WARN remains an observation capability; it does not turn an assertion into a pass.\\n\\n## Validation and immutability\\nA successful native screenshot result must retain its expected media reference. If that file is missing, collection stops before finalization with exit code 2. The incomplete staging directory and unchanged native run logs remain available for diagnosis. No sealed run is published.\\n\\nFinalization builds privately, validates records and source assets, seals files and publishes without replacing another identity. Publication reserves the destination name with an exclusive mkdir, then renames the sealed tree from a staging folder in the same parent onto that empty reservation. An existing name stops publication; a rename never copies and never replaces a non-empty run.\\n\\nConsumers reject unsupported schemas, missing or changed media, invalid PNG or WebM data, bad references and order, symlinks, writable sealed files and incomplete finalization. A rejected run is not rewritten or resealed. Validation and reporting are read-only.\\n\\nRetries use new run IDs. Captures within a step increase their sequence without replacing earlier media. Titles can change without changing case IDs. Do not migrate earlier archives automatically. Explicit historical reuse preserves original bytes and provenance and must not claim to show the current application.\\n\\n## Native terminal surface\\n\\nThe common run surface is web for Surf/Playwright, tui for the Linux native terminal driver, and gui for Linux X11 capture. Native assets use driver tui and captureMethod grim-native. Terminal metadata binds session, socket, pane, PTY, runtime directory, Wayland display, Cage PID, foot PID, columns, rows, font, lineHeight and released owned cleanup to the captured PNG. Event and asset metadata must agree. Image dimensions and SHA-256 come from actual media bytes, not the character grid.\\n\\nThe same Plan/Test/Step model records the approved terminal command and directory. approval.terminal must match that scope exactly. Every input requires expected current screen content and an approved stable step ID. Native expect steps check image dimensions, RGB probes and at least two distinct text line positions. A matching buffer alone cannot prove the visible frame. Read tui.md for the playbook and current native verification blocker.\\n\\nCase notes and reports retain native limitations and application-side-effect warnings. Native video is explicitly unavailable. Preserve native termscope JSONL, stderr and frame images without schema injection or reconstruction.\\n\\n## Native GUI surface\\n\\nGUI assets use captureMethod x11-imagemagick-import. Their gui identity records the approved local X11 display, exact window ID or root, title, borrowed ownership and preserved cleanup. Both plan.gui and approval.gui must match. GUI collection rejects all automated input. Image expectations contain actual dimensions and RGB probes. GUI permission failures seal blocked cases without media. Native video is unavailable. See [the GUI playbook](gui.md).\\n\\n## Historical reports\\n\\n`report <selected-run> --historical` labels a read-only HTML or JSON report as historical. It does not modify `run.json` or claim that the run represents current application state. Known capture dates and null dates remain unchanged. Feedback imports use their own explicit `--historical` selection and retain the original sealed snapshot.\\n\\n## Contract versions and ownership\\n\\n`contracts.json` declares `collect-evidence/v2` production and independent `collect-evidence/v1` acceptance. The v2 discriminated family uses `schemaVersion: collect-evidence/v2` plus `kind`. It owns authored plans, workspace and compilation metadata, sealed runs, case acceptance records, asset metadata, ordered events, errors, driver maps, command results and generated manual comments. Plan, run and case fields retain the structures above. Workspace and compilation records use kind `event`; workspace fields bind repository, workflow, runId and destination, while compilation fields bind driver and planHash. Command success and failure use kind `event` or `error`, command, success and command-specific fields; errors add code and message. A typed authored plan has the version and kind directly; a persisted plan envelope has them beside `data`.\\n\\nHistorical v1 uses `schema: collect-evidence/v1`. Its authoritative retained definition is [evidence-v1.md](evidence-v1.md). Readers preserve returned historical headers and validate all original hashes without executing archived plan.ts. Explicit unknown identifiers, mixed identity fields and unversioned sealed record envelopes fail. Only historical plan data and native driver observations can omit a header; their enclosing registered records identify their interpretation.\\n\\nNo upgrade path is declared. Sealed runs, captured assets and original native files are immutable. Historical authored workspaces cannot render, compile or run in place. Initialize a new identity and author a current approved plan. Read-only validate, verdicts, report and comment commands never migrate stored bytes. Native PNG, WebM, logs and third-party outputs receive no version injection. Local finalization publishes only to the resolved evidence store; external sharing needs separate access approval. Evidence is not a worktree receipt or proof of implementation completion.\\n\\nThe collector owns capture and acceptance meaning. `writing-reports` retains presentation ownership and consumes the validated records; this manifest does not claim report-generation contracts.\\n\\nCurrent compiled.json metadata must not contain schema, even when schemaVersion, kind and planHash match. Both run and run --dry-run reject mixed identities with exit code 2 before driver startup or staging and destination writes. Recompile current authored plans; do not rewrite sealed historical records.\\n\\n\"\n    },\n    \"collect-evidence/v1\": {\n      \"reference\": \"file:references/evidence-v1.md\",\n      \"path\": \"/run/media/zenobius/Store/Projects/Mine/Github/Dotfiles.worktrees/integration-25ebc078-060c-4dff-a84b-06c0b5971b15/mise/conf.d/devtools-agent/bundles/developer/skills/browsers/collect-evidence/references/evidence-v1.md\",\n      \"content\": \"---\\nschema: collect-evidence/v1\\nkind: contract\\n---\\n# Common evidence contract\\n\\nEvery first-party JSON file and JSONL record uses schema collect-evidence/v1 and a kind. Owned Markdown has the same schema in frontmatter. Preserve tool-native bytes under native/.\\n\\n| Kind | Authoritative content |\\n|---|---|\\n| run | Stable run ID, sealed status, actual collection interval, driver provenance, ordered cases and file inventory hashes. |\\n| plan | The authored typed Plan in data. Consumers do not execute the preserved plan.ts. |\\n| case | Stable case ID, purpose, preconditions, ordered steps, expectations, observations, assets, errors and limits. |\\n| asset | Stable capture ID, case and step references, increasing sequence, descriptive media path, actual SHA-256, dimensions, media type, capture time and driver provenance. |\\n| event | Ordered observations, assertionResult, captureStatus and registered asset references. |\\n| error | Explicit assertion, capture, blocked or operation failure. |\\n\\n## Layout\\n\\nA run has run.json, plan.ts, plan.json and index.md. Each cases/<id>/ directory has case.json, index.md, events.jsonl and media/. Asset and error records are embedded in case.json. Preserve native scripts, workflows, logs, original screenshots and recordings under native/.\\n\\nImages use actual PNG bytes. WebM recordings have scope case and a sourcePath for the preserved native file. Duration, viewport and capture time can be null when the source did not record them. Do not substitute file modification time or import time. Asset hashes identify the exact source bytes.\\n\\n## Results\\n\\nCapture status is captured, failed or not-requested. Assertion results are passed, failed, not-run or not-applicable. Only an executed expect with assertionPassed true establishes a passing assertion. A captured image, process exit or successful cleanup is not an assertion.\\n\\nPASS requires completed steps, executed passing assertions and image evidence. FAIL records an actual failure. BLOCKED identifies an unmet prerequisite or safety stop. PARTIAL records missing proof or human work. WARN remains an observation capability; it does not turn an assertion into a pass.\\n\\n## Validation and immutability\\nA successful native screenshot result must retain its expected media reference. If that file is missing, collection stops before finalization with exit code 2. The incomplete staging directory and unchanged native run logs remain available for diagnosis. No sealed run is published.\\n\\nFinalization builds privately, validates records and source assets, seals files and publishes without replacing another identity. Publication reserves the destination name with an exclusive mkdir, then renames the sealed tree from a staging folder in the same parent onto that empty reservation. An existing name stops publication; a rename never copies and never replaces a non-empty run.\\n\\nConsumers reject unsupported schemas, missing or changed media, invalid PNG or WebM data, bad references and order, symlinks, writable sealed files and incomplete finalization. A rejected run is not rewritten or resealed. Validation and reporting are read-only.\\n\\nRetries use new run IDs. Captures within a step increase their sequence without replacing earlier media. Titles can change without changing case IDs. Do not migrate earlier archives automatically. Explicit historical reuse preserves original bytes and provenance and must not claim to show the current application.\\n\\n## Native terminal surface\\n\\nThe common run surface is web for Surf/Playwright, tui for the Linux native terminal driver, and gui for Linux X11 capture. Native assets use driver tui and captureMethod grim-native. Terminal metadata binds session, socket, pane, PTY, runtime directory, Wayland display, Cage PID, foot PID, columns, rows, font, lineHeight and released owned cleanup to the captured PNG. Event and asset metadata must agree. Image dimensions and SHA-256 come from actual media bytes, not the character grid.\\n\\nThe same Plan/Test/Step model records the approved terminal command and directory. approval.terminal must match that scope exactly. Every input requires expected current screen content and an approved stable step ID. Native expect steps check image dimensions, RGB probes and at least two distinct text line positions. A matching buffer alone cannot prove the visible frame. Read tui.md for the playbook and current native verification blocker.\\n\\nCase notes and reports retain native limitations and application-side-effect warnings. Native video is explicitly unavailable. Preserve native termscope JSONL, stderr and frame images without schema injection or reconstruction.\\n\\n## Native GUI surface\\n\\nGUI assets use captureMethod x11-imagemagick-import. Their gui identity records the approved local X11 display, exact window ID or root, title, borrowed ownership and preserved cleanup. Both plan.gui and approval.gui must match. GUI collection rejects all automated input. Image expectations contain actual dimensions and RGB probes. GUI permission failures seal blocked cases without media. Native video is unavailable. See [the GUI playbook](gui.md).\\n\\n## Historical reports\\n\\n`report <selected-run> --historical` labels a read-only HTML or JSON report as historical. It does not modify `run.json` or claim that the run represents current application state. Known capture dates and null dates remain unchanged. Feedback imports use their own explicit `--historical` selection and retain the original sealed snapshot.\\n\"\n    }\n  },\n  \"procedures\": []\n}\n",source_commit: 0df154b1564fbc7d393ccc913192f73daf8e394c,source_tree: 1918805705f83879f8e12598739cfc7661771399},{argv: [mise/conf.d/devtools-agent/bundles/agent-core/skills/skill-contracts/scripts/router.ts,validate,"--skill",mise/conf.d/devtools-agent/bundles/developer/skills/browsers/collect-feedback],cwd: /run/media/zenobius/Store/Projects/Mine/Github/Dotfiles.worktrees/integration-25ebc078-060c-4dff-a84b-06c0b5971b15,exit_code: 0,output: "{\n  \"manifest\": {\n    \"schemaVersion\": \"skill-contract-manifest/v1\",\n    \"produces\": [\n      \"collect-feedback/v2\"\n    ],\n    \"accepts\": [\n      \"collect-feedback/v2\",\n      \"collect-feedback/v1\",\n      \"collect-evidence/v2\",\n      \"collect-evidence/v1\"\n    ],\n    \"contracts\": {\n      \"collect-feedback/v2\": \"file:references/viewer-contract.md\",\n      \"collect-feedback/v1\": \"file:references/feedback-v1.md\",\n      \"collect-evidence/v2\": \"file:../collect-evidence/references/evidence-schema.md\",\n      \"collect-evidence/v1\": \"file:../collect-evidence/references/evidence-v1.md\"\n    },\n    \"upgrades\": []\n  },\n  \"definitions\": {\n    \"collect-feedback/v2\": {\n      \"reference\": \"file:references/viewer-contract.md\",\n      \"path\": \"/run/media/zenobius/Store/Projects/Mine/Github/Dotfiles.worktrees/integration-25ebc078-060c-4dff-a84b-06c0b5971b15/mise/conf.d/devtools-agent/bundles/developer/skills/browsers/collect-feedback/references/viewer-contract.md\",\n      \"content\": \"---\\nschemaVersion: collect-feedback/v2\\nkind: reference\\n---\\n# Image and video feedback contract\\n\\nUse the [how-to](../howto.md) for review procedures, the [CLI reference](cli.md) for commands,\\nand the [system explanation](system.md) for routing and record authority.\\n\\n## Storage and identity\\n\\nImport sealed evidence through the existing shared-context evidence route. Preserve the source snapshot and immutable media. Each case stores annotations in `cases/<case-id>/annotations/<annotation-id>.json`. Each record uses `collect-feedback/v2`, kind `annotation`, stable annotation/session/case/asset IDs, source SHA-256, original dimensions, priority, comment, revision and creation/update timestamps.\\n\\nGeometry uses normalized top-left `{x,y,width,height}` coordinates. A point has zero width and height. A box has positive width and height. Round the left, top, right and bottom original-pixel edges once. Derive pixel width and height from the rounded edges. Source identity changes require a new import.\\n\\n## HTTP API\\n\\n| Route | Result |\\n|---|---|\\n| GET / | Prebuilt React/Base Nova viewer with bundled CSS and JetBrains Mono fonts. |\\n| GET /api/v1/session | Session plus the current in-memory writeToken. |\\n| GET /api/v1/cases | Ordered cases and registered assets. |\\n| GET /api/v1/assets/:id | Verified original bytes and hash ETag. Single byte ranges return 206; invalid ranges return 416. |\\n| GET /api/v1/annotations | Saved annotations. |\\n| POST /api/v1/annotations | Durable saved annotation and revision ETag. |\\n| PATCH /api/v1/annotations/:id | Revision-checked edit or undo and a new ETag. |\\n| DELETE /api/v1/annotations/:id | Reversible tombstone and a new ETag. |\\n| GET /api/v1/export | Verified session, cases, source assets and annotations. |\\n\\nJSON responses have schemaVersion, kind and success. Errors include a message. Every mutation requires Content-Type application/json, the exact same Origin and X-Write-Token from the session response. Tokens stay in memory and never appear in readiness output or logs.\\n\\nThe creation payload contains exactly schemaVersion, kind, id, sessionId, caseId, assetId, sourceSha256, originalWidth, originalHeight, geometry, priority and comment. Priority is P1, P2 or P3. The comment must contain text. A saved annotation adds revision 1, createdAt, updatedAt and pixelGeometry. Its ETag is `\\\"<id>:1\\\"`. Retrying an identical ID and payload returns the original record. Different content for that ID returns 409.\\n\\nPATCH requires schemaVersion collect-feedback/v2 and kind annotation, plus one or more of comment, priority or geometry. Source identity fields cannot change. DELETE requires exactly schemaVersion and kind. Undo uses PATCH with only schemaVersion, kind and deletedAt: null. PATCH and DELETE require If-Match containing the last acknowledged ETag, such as \\\"note-id:1\\\". A missing precondition returns 428; a stale revision returns 412. Successful mutations increment revision and update updatedAt. DELETE sets deletedAt while retaining all annotation content; undo clears deletedAt. Older creation records without deletedAt remain valid. Export includes tombstones.\\n\\nThe service checks source records and bytes before every mutation and export. It checks Host, Origin, Fetch Metadata, registered IDs, payload schemaVersion, geometry and request size before mutation. A changed source returns 409. Invalid payloads return 400. Authorization failures return 403. Unsupported content types return 415. Oversized requests return 413. Unknown routes return 404 and unsupported methods return 405.\\n\\n## Safety and shutdown\\n\\nBind only to 127.0.0.1 on an explicit port. Refuse a second session writer and occupied ports without fallback. Reject encoded paths, query strings and symlink components. Use non-following descriptors and Linux /proc/self/fd checks for registered reads and annotation publication.\\n\\nLimit URLs to 2048 characters, headers to 8192 characters and request bodies to 65536 bytes. Allow at most 16 concurrent requests. Keep idle timeout at 10 seconds. Registered assets are limited to 128 MiB and session records to 4 MiB.\\n\\nPublish complete annotation JSON atomically after syncing file data. Sync the containing directory before acknowledgement. Keep the same stable ID after a failed save. On SIGINT or SIGTERM, stop accepting work, drain active saves and responses, then release only the owned lock inode. A crash can retain a writer lock; the CLI does not steal it.\\n\\n## UI and export\\n\\nClick an image for a point or drag in either direction for a box. Point and Box controls provide keyboard creation. Arrows move; Shift plus arrows resize a box. Escape cancels. Ctrl or Meta plus Enter saves a nonblank comment. Select a saved pin to inspect it without a draft or write. Use Edit note for a draft and Delete note for a tombstone. Undo deletion remains available after reload and restart. A conflict keeps the draft and its starting revision and shows the current saved content, priority, geometry and deletion state. Use saved revision for next save explicitly adopts the displayed live revision; a subsequent save still uses If-Match. If a retry finds exactly the submitted live content, it re-saves that content with its current precondition for a durable acknowledgement. A further concurrent change still fails safely. Start at P2 Friction. Label P1 Blocker and P3 Polish. Show Saved only after the server confirms a durable write. Failed saves retain the draft, starting revision, stable ID and frozen retry payload across navigation and reload. Saved server annotations remain authoritative.\\n\\nBrowser recovery records use `collect-feedback/v2`, kind `draft`, an `annotation` input, nullable `startingRevision`, optional frozen `submitted` input and optional error. New notes use a null starting revision. The input binds session, case, asset ID, source SHA-256 and original dimensions. Recovery requires an exact image identity match. It never adopts a newer saved revision automatically.\\n\\nDrafts use tab-local `sessionStorage`, keyed by session ID and source run at the current origin. They survive navigation and reload, not tab closure or a port change. Browser storage failures retain in-memory drafts and show a memory-only warning. Unsupported or unreadable stored drafts block UI export until explicitly discarded.\\n\\nThe viewer export control checks all drafts, including drafts on unselected or unavailable images. Open a draft to save it, or explicitly discard it. Pending writes block export and discard. An unchanged saved-note selection creates no draft. CLI and direct API exports cannot inspect browser drafts and always contain saved records only.\\n\\nKeep pins in image coordinates through zoom, scroll pan and viewport changes. Keep the selected pin visible and clamp its floating editor. Keep the original media bytes unchanged.\\n\\nThe installed `export <session> --json` command and GET export return the same saved data. Export validates immutable source bytes and does not alter session records, timestamps or annotations.\\n\\n## Distribution and verification\\n\\nBuild from viewer/ with `mise exec -- bun install --frozen-lockfile` and `mise exec -- bun run build`. Commit viewer/index.html. Server startup reads this file without a build or CDN access.\\n\\nRun scripts/collect-feedback/test/workflow.test.ts with Bun. Exercise the actual bundled browser page separately. Check point and reverse-box creation, keyboard controls, source hash binding, odd-width image bounds, case and asset navigation, reload, concurrent revisions, failed disk writes, failed browser storage, guarded UI export, server restart and read-only CLI export.\\n\\n\\n## Paused video notes\\n\\nA video creation payload adds `mediaTimeSeconds`, `displayedWidth` and `displayedHeight` to the image annotation fields. The timestamp must be finite, non-negative and within the known recording duration. Displayed dimensions are positive CSS-pixel dimensions of the uncropped frame at creation. `originalWidth` and `originalHeight` remain the registered video-track dimensions. Geometry uses those original dimensions for pixel bounds. Image payloads reject video fields.\\n\\nTiming and source bindings cannot change through PATCH. Edit comments, priority and geometry at the same timestamp. Create another note for another timestamp. The viewer locks playback and seeking while a draft exists, restores the draft timestamp after reload, and opens saved notes at their recorded position. Pins appear only at their bound paused timestamp, not during playback. Draft recovery, stable retries, revision conflicts, tombstones, export checks and original-byte validation use the existing annotation path.\\n\\n\\nUndo deletion of a video note pauses playback and seeks to its bound timestamp. The viewer selects the restored pin after seeking completes. Undo deletion and keep draft retains the existing draft and its timestamp instead of selecting the saved note. Image undo selects the restored pin without media seeking.\\n\\n## Historical selection\\n\\n`init <sealed-run> --historical` explicitly selects an earlier run for a new session. The versioned session adds optional `historical: true`. Existing sessions without this field remain readable and unchanged. The viewer, exports and writing-reports preserve this selection. `false`, strings and unknown session schemaVersion versions are invalid. The sealed source snapshot is not relabelled or rewritten.\\n\\nCapture dates remain those in each asset. Null dates remain unknown. The import timestamp describes only session creation. Source schemaVersion checks run before store writes. No legacy format is inferred from filenames.\\n\\n## Contract versions and immutable history\\n\\n`contracts.json` declares `collect-feedback/v2` output and accepts v2 and historical `collect-feedback/v1`, plus both evidence versions by reference to the collector owner. Current records use `schemaVersion: collect-feedback/v2` and `kind`. The discriminated family covers session metadata, case acceptance views, annotation inputs and saved revisions, browser draft recovery, exports, service responses, command results and lock metadata. Session fields bind id, createdAt, original source run plus manifestSha256 and ordered cases. Case views retain source case fields, replace runId with sessionId and bind source runId/caseId. Exports use kind `export`, success, session, cases, assets and annotations. Command results use kind `event` or `error`, success and command-specific fields. Errors include code and message. HTTP responses retain their existing /api/v1 routes; route versions are not record versions.\\n\\nThe [retained v1 definition](feedback-v1.md) uses `schema: collect-feedback/v1`. Validation and exports retain historical session, case, annotation and nested source headers. New sessions can import either sealed evidence version without changing any source record or media byte. Imports preserve original references, capture dates and checksums. New exports use a v2 envelope even when their nested records are historical.\\n\\nNo conversion is declared. Historical sessions and saved v1 annotations are read-only. Create a new session from its sealed source to add current notes. The mutation boundary rejects conversion before writing. Browser recovery keeps its stable storage key. A v1 draft is retained with an unreadable-recovery warning until the operator explicitly discards it; it is never silently relabelled or overwritten. Read-only validate and export operations do not acquire a writer lock or change stored bytes. The viewer remains loopback-only, with the existing source checks, write token and revision checks. Local serving does not approve external publication. Report-generation ownership remains separate.\\n\"\n    },\n    \"collect-feedback/v1\": {\n      \"reference\": \"file:references/feedback-v1.md\",\n      \"path\": \"/run/media/zenobius/Store/Projects/Mine/Github/Dotfiles.worktrees/integration-25ebc078-060c-4dff-a84b-06c0b5971b15/mise/conf.d/devtools-agent/bundles/developer/skills/browsers/collect-feedback/references/feedback-v1.md\",\n      \"content\": \"---\\nschema: collect-feedback/v1\\nkind: reference\\n---\\n# Image and video feedback contract\\n\\nUse the [how-to](../howto.md) for review procedures, the [CLI reference](cli.md) for commands,\\nand the [system explanation](system.md) for routing and record authority.\\n\\n## Storage and identity\\n\\nImport sealed evidence through the existing shared-context evidence route. Preserve the source snapshot and immutable media. Each case stores annotations in `cases/<case-id>/annotations/<annotation-id>.json`. Each record uses `collect-feedback/v1`, kind `annotation`, stable annotation/session/case/asset IDs, source SHA-256, original dimensions, priority, comment, revision and creation/update timestamps.\\n\\nGeometry uses normalized top-left `{x,y,width,height}` coordinates. A point has zero width and height. A box has positive width and height. Round the left, top, right and bottom original-pixel edges once. Derive pixel width and height from the rounded edges. Source identity changes require a new import.\\n\\n## HTTP API\\n\\n| Route | Result |\\n|---|---|\\n| GET / | Prebuilt React/Base Nova viewer with bundled CSS and JetBrains Mono fonts. |\\n| GET /api/v1/session | Session plus the current in-memory writeToken. |\\n| GET /api/v1/cases | Ordered cases and registered assets. |\\n| GET /api/v1/assets/:id | Verified original bytes and hash ETag. Single byte ranges return 206; invalid ranges return 416. |\\n| GET /api/v1/annotations | Saved annotations. |\\n| POST /api/v1/annotations | Durable saved annotation and revision ETag. |\\n| PATCH /api/v1/annotations/:id | Revision-checked edit or undo and a new ETag. |\\n| DELETE /api/v1/annotations/:id | Reversible tombstone and a new ETag. |\\n| GET /api/v1/export | Verified session, cases, source assets and annotations. |\\n\\nJSON responses have schema, kind and success. Errors include a message. Every mutation requires Content-Type application/json, the exact same Origin and X-Write-Token from the session response. Tokens stay in memory and never appear in readiness output or logs.\\n\\nThe creation payload contains exactly schema, kind, id, sessionId, caseId, assetId, sourceSha256, originalWidth, originalHeight, geometry, priority and comment. Priority is P1, P2 or P3. The comment must contain text. A saved annotation adds revision 1, createdAt, updatedAt and pixelGeometry. Its ETag is `\\\"<id>:1\\\"`. Retrying an identical ID and payload returns the original record. Different content for that ID returns 409.\\n\\nPATCH requires schema collect-feedback/v1 and kind annotation, plus one or more of comment, priority or geometry. Source identity fields cannot change. DELETE requires exactly schema and kind. Undo uses PATCH with only schema, kind and deletedAt: null. PATCH and DELETE require If-Match containing the last acknowledged ETag, such as \\\"note-id:1\\\". A missing precondition returns 428; a stale revision returns 412. Successful mutations increment revision and update updatedAt. DELETE sets deletedAt while retaining all annotation content; undo clears deletedAt. Older creation records without deletedAt remain valid. Export includes tombstones.\\n\\nThe service checks source records and bytes before every mutation and export. It checks Host, Origin, Fetch Metadata, registered IDs, payload schema, geometry and request size before mutation. A changed source returns 409. Invalid payloads return 400. Authorization failures return 403. Unsupported content types return 415. Oversized requests return 413. Unknown routes return 404 and unsupported methods return 405.\\n\\n## Safety and shutdown\\n\\nBind only to 127.0.0.1 on an explicit port. Refuse a second session writer and occupied ports without fallback. Reject encoded paths, query strings and symlink components. Use non-following descriptors and Linux /proc/self/fd checks for registered reads and annotation publication.\\n\\nLimit URLs to 2048 characters, headers to 8192 characters and request bodies to 65536 bytes. Allow at most 16 concurrent requests. Keep idle timeout at 10 seconds. Registered assets are limited to 128 MiB and session records to 4 MiB.\\n\\nPublish complete annotation JSON atomically after syncing file data. Sync the containing directory before acknowledgement. Keep the same stable ID after a failed save. On SIGINT or SIGTERM, stop accepting work, drain active saves and responses, then release only the owned lock inode. A crash can retain a writer lock; the CLI does not steal it.\\n\\n## UI and export\\n\\nClick an image for a point or drag in either direction for a box. Point and Box controls provide keyboard creation. Arrows move; Shift plus arrows resize a box. Escape cancels. Ctrl or Meta plus Enter saves a nonblank comment. Select a saved pin to inspect it without a draft or write. Use Edit note for a draft and Delete note for a tombstone. Undo deletion remains available after reload and restart. A conflict keeps the draft and its starting revision and shows the current saved content, priority, geometry and deletion state. Use saved revision for next save explicitly adopts the displayed live revision; a subsequent save still uses If-Match. If a retry finds exactly the submitted live content, it re-saves that content with its current precondition for a durable acknowledgement. A further concurrent change still fails safely. Start at P2 Friction. Label P1 Blocker and P3 Polish. Show Saved only after the server confirms a durable write. Failed saves retain the draft, starting revision, stable ID and frozen retry payload across navigation and reload. Saved server annotations remain authoritative.\\n\\nBrowser recovery records use `collect-feedback/v1`, kind `draft`, an `annotation` input, nullable `startingRevision`, optional frozen `submitted` input and optional error. New notes use a null starting revision. The input binds session, case, asset ID, source SHA-256 and original dimensions. Recovery requires an exact image identity match. It never adopts a newer saved revision automatically.\\n\\nDrafts use tab-local `sessionStorage`, keyed by session ID and source run at the current origin. They survive navigation and reload, not tab closure or a port change. Browser storage failures retain in-memory drafts and show a memory-only warning. Unsupported or unreadable stored drafts block UI export until explicitly discarded.\\n\\nThe viewer export control checks all drafts, including drafts on unselected or unavailable images. Open a draft to save it, or explicitly discard it. Pending writes block export and discard. An unchanged saved-note selection creates no draft. CLI and direct API exports cannot inspect browser drafts and always contain saved records only.\\n\\nKeep pins in image coordinates through zoom, scroll pan and viewport changes. Keep the selected pin visible and clamp its floating editor. Keep the original media bytes unchanged.\\n\\nThe installed `export <session> --json` command and GET export return the same saved data. Export validates immutable source bytes and does not alter session records, timestamps or annotations.\\n\\n## Distribution and verification\\n\\nBuild from viewer/ with `mise exec -- bun install --frozen-lockfile` and `mise exec -- bun run build`. Commit viewer/index.html. Server startup reads this file without a build or CDN access.\\n\\nRun scripts/collect-feedback/test/workflow.test.ts with Bun. Exercise the actual bundled browser page separately. Check point and reverse-box creation, keyboard controls, source hash binding, odd-width image bounds, case and asset navigation, reload, concurrent revisions, failed disk writes, failed browser storage, guarded UI export, server restart and read-only CLI export.\\n\\n\\n## Paused video notes\\n\\nA video creation payload adds `mediaTimeSeconds`, `displayedWidth` and `displayedHeight` to the image annotation fields. The timestamp must be finite, non-negative and within the known recording duration. Displayed dimensions are positive CSS-pixel dimensions of the uncropped frame at creation. `originalWidth` and `originalHeight` remain the registered video-track dimensions. Geometry uses those original dimensions for pixel bounds. Image payloads reject video fields.\\n\\nTiming and source bindings cannot change through PATCH. Edit comments, priority and geometry at the same timestamp. Create another note for another timestamp. The viewer locks playback and seeking while a draft exists, restores the draft timestamp after reload, and opens saved notes at their recorded position. Pins appear only at their bound paused timestamp, not during playback. Draft recovery, stable retries, revision conflicts, tombstones, export checks and original-byte validation use the existing annotation path.\\n\\n\\nUndo deletion of a video note pauses playback and seeks to its bound timestamp. The viewer selects the restored pin after seeking completes. Undo deletion and keep draft retains the existing draft and its timestamp instead of selecting the saved note. Image undo selects the restored pin without media seeking.\\n\\n## Historical selection\\n\\n`init <sealed-run> --historical` explicitly selects an earlier run for a new session. The versioned session adds optional `historical: true`. Existing sessions without this field remain readable and unchanged. The viewer, exports and writing-reports preserve this selection. `false`, strings and unknown session schema versions are invalid. The sealed source snapshot is not relabelled or rewritten.\\n\\nCapture dates remain those in each asset. Null dates remain unknown. The import timestamp describes only session creation. Source schema checks run before store writes. No legacy format is inferred from filenames.\\n\"\n    },\n    \"collect-evidence/v2\": {\n      \"reference\": \"file:../collect-evidence/references/evidence-schema.md\",\n      \"path\": \"/run/media/zenobius/Store/Projects/Mine/Github/Dotfiles.worktrees/integration-25ebc078-060c-4dff-a84b-06c0b5971b15/mise/conf.d/devtools-agent/bundles/developer/skills/browsers/collect-evidence/references/evidence-schema.md\",\n      \"content\": \"---\\nschemaVersion: collect-evidence/v2\\nkind: contract\\n---\\n# Common evidence contract\\n\\nEvery first-party JSON file and JSONL record uses schemaVersion collect-evidence/v2 and a kind. Owned Markdown has the same schemaVersion in frontmatter. Preserve tool-native bytes under native/.\\n\\n| Kind | Authoritative content |\\n|---|---|\\n| run | Stable run ID, sealed status, actual collection interval, driver provenance, ordered cases and file inventory hashes. |\\n| plan | The authored typed Plan in data. Consumers do not execute the preserved plan.ts. |\\n| case | Stable case ID, purpose, preconditions, ordered steps, expectations, observations, assets, errors and limits. |\\n| asset | Stable capture ID, case and step references, increasing sequence, descriptive media path, actual SHA-256, dimensions, media type, capture time and driver provenance. |\\n| event | Ordered observations, assertionResult, captureStatus and registered asset references. |\\n| error | Explicit assertion, capture, blocked or operation failure. |\\n\\n## Layout\\n\\nA run has run.json, plan.ts, plan.json and index.md. Each cases/<id>/ directory has case.json, index.md, events.jsonl and media/. Asset and error records are embedded in case.json. Preserve native scripts, workflows, logs, original screenshots and recordings under native/.\\n\\nImages use actual PNG bytes. WebM recordings have scope case and a sourcePath for the preserved native file. Duration, viewport and capture time can be null when the source did not record them. Do not substitute file modification time or import time. Asset hashes identify the exact source bytes.\\n\\n## Results\\n\\nCapture status is captured, failed or not-requested. Assertion results are passed, failed, not-run or not-applicable. Only an executed expect with assertionPassed true establishes a passing assertion. A captured image, process exit or successful cleanup is not an assertion.\\n\\nPASS requires completed steps, executed passing assertions and image evidence. FAIL records an actual failure. BLOCKED identifies an unmet prerequisite or safety stop. PARTIAL records missing proof or human work. WARN remains an observation capability; it does not turn an assertion into a pass.\\n\\n## Validation and immutability\\nA successful native screenshot result must retain its expected media reference. If that file is missing, collection stops before finalization with exit code 2. The incomplete staging directory and unchanged native run logs remain available for diagnosis. No sealed run is published.\\n\\nFinalization builds privately, validates records and source assets, seals files and publishes without replacing another identity. Publication reserves the destination name with an exclusive mkdir, then renames the sealed tree from a staging folder in the same parent onto that empty reservation. An existing name stops publication; a rename never copies and never replaces a non-empty run.\\n\\nConsumers reject unsupported schemas, missing or changed media, invalid PNG or WebM data, bad references and order, symlinks, writable sealed files and incomplete finalization. A rejected run is not rewritten or resealed. Validation and reporting are read-only.\\n\\nRetries use new run IDs. Captures within a step increase their sequence without replacing earlier media. Titles can change without changing case IDs. Do not migrate earlier archives automatically. Explicit historical reuse preserves original bytes and provenance and must not claim to show the current application.\\n\\n## Native terminal surface\\n\\nThe common run surface is web for Surf/Playwright, tui for the Linux native terminal driver, and gui for Linux X11 capture. Native assets use driver tui and captureMethod grim-native. Terminal metadata binds session, socket, pane, PTY, runtime directory, Wayland display, Cage PID, foot PID, columns, rows, font, lineHeight and released owned cleanup to the captured PNG. Event and asset metadata must agree. Image dimensions and SHA-256 come from actual media bytes, not the character grid.\\n\\nThe same Plan/Test/Step model records the approved terminal command and directory. approval.terminal must match that scope exactly. Every input requires expected current screen content and an approved stable step ID. Native expect steps check image dimensions, RGB probes and at least two distinct text line positions. A matching buffer alone cannot prove the visible frame. Read tui.md for the playbook and current native verification blocker.\\n\\nCase notes and reports retain native limitations and application-side-effect warnings. Native video is explicitly unavailable. Preserve native termscope JSONL, stderr and frame images without schema injection or reconstruction.\\n\\n## Native GUI surface\\n\\nGUI assets use captureMethod x11-imagemagick-import. Their gui identity records the approved local X11 display, exact window ID or root, title, borrowed ownership and preserved cleanup. Both plan.gui and approval.gui must match. GUI collection rejects all automated input. Image expectations contain actual dimensions and RGB probes. GUI permission failures seal blocked cases without media. Native video is unavailable. See [the GUI playbook](gui.md).\\n\\n## Historical reports\\n\\n`report <selected-run> --historical` labels a read-only HTML or JSON report as historical. It does not modify `run.json` or claim that the run represents current application state. Known capture dates and null dates remain unchanged. Feedback imports use their own explicit `--historical` selection and retain the original sealed snapshot.\\n\\n## Contract versions and ownership\\n\\n`contracts.json` declares `collect-evidence/v2` production and independent `collect-evidence/v1` acceptance. The v2 discriminated family uses `schemaVersion: collect-evidence/v2` plus `kind`. It owns authored plans, workspace and compilation metadata, sealed runs, case acceptance records, asset metadata, ordered events, errors, driver maps, command results and generated manual comments. Plan, run and case fields retain the structures above. Workspace and compilation records use kind `event`; workspace fields bind repository, workflow, runId and destination, while compilation fields bind driver and planHash. Command success and failure use kind `event` or `error`, command, success and command-specific fields; errors add code and message. A typed authored plan has the version and kind directly; a persisted plan envelope has them beside `data`.\\n\\nHistorical v1 uses `schema: collect-evidence/v1`. Its authoritative retained definition is [evidence-v1.md](evidence-v1.md). Readers preserve returned historical headers and validate all original hashes without executing archived plan.ts. Explicit unknown identifiers, mixed identity fields and unversioned sealed record envelopes fail. Only historical plan data and native driver observations can omit a header; their enclosing registered records identify their interpretation.\\n\\nNo upgrade path is declared. Sealed runs, captured assets and original native files are immutable. Historical authored workspaces cannot render, compile or run in place. Initialize a new identity and author a current approved plan. Read-only validate, verdicts, report and comment commands never migrate stored bytes. Native PNG, WebM, logs and third-party outputs receive no version injection. Local finalization publishes only to the resolved evidence store; external sharing needs separate access approval. Evidence is not a worktree receipt or proof of implementation completion.\\n\\nThe collector owns capture and acceptance meaning. `writing-reports` retains presentation ownership and consumes the validated records; this manifest does not claim report-generation contracts.\\n\\nCurrent compiled.json metadata must not contain schema, even when schemaVersion, kind and planHash match. Both run and run --dry-run reject mixed identities with exit code 2 before driver startup or staging and destination writes. Recompile current authored plans; do not rewrite sealed historical records.\\n\\n\"\n    },\n    \"collect-evidence/v1\": {\n      \"reference\": \"file:../collect-evidence/references/evidence-v1.md\",\n      \"path\": \"/run/media/zenobius/Store/Projects/Mine/Github/Dotfiles.worktrees/integration-25ebc078-060c-4dff-a84b-06c0b5971b15/mise/conf.d/devtools-agent/bundles/developer/skills/browsers/collect-evidence/references/evidence-v1.md\",\n      \"content\": \"---\\nschema: collect-evidence/v