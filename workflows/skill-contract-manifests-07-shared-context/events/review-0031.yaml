\\nThe installed `contracts.json` declares support. Run the shared skill-contracts router to validate declarations or resolve definitions. Shared-context validates domain content at owning operations. The definitions below are authoritative.\\n\\n## Configuration\\n\\n- `shared-context-routes/v2`: historical TOML with `schema = 2` and six `[records.<kind>]` tables: alignment, tickets, initiatives, workflows, evidence, sources. Each table has an adapter. Local tickets accept `markdown` or `local-markdown` and require a store. External ticket adapters have no store. Other stores are `repository` or `shared`; evidence also accepts `inherit:workflows`, and sources accepts `inherit:alignment`. Adapter identifiers use lowercase letters, digits, and hyphens. Unknown authored fields remain preserved.\\n- `shared-context-routes/v3`: the same interpretation, with `schemaVersion = \\\"shared-context-routes/v3\\\"` instead of `schema`. Both fields together are invalid.\\n- `shared-context-layout/v1`: historical TOML with `schema = 1` and optional `[paths]`. Only tracker and sources paths are supported. Paths are nonempty relative directories without traversal, empty components, backslashes, NUL, or drive prefixes.\\n- `shared-context-layout/v2`: the same interpretation, with `schemaVersion = \\\"shared-context-layout/v2\\\"` instead of `schema`. Both fields together are invalid.\\n- `shared-context-config/v1`: machine-local JSON with optional `schemaVersion` equal to this identifier and a nonempty string `storage_path`. Missing configuration uses the default without writing. Historical unversioned JSON uses the same rules. Unknown explicit identifiers fail. This reader never renames `storage_path`.\\n- `shared-context-project/v1`: stored project JSON with optional `schemaVersion` equal to this identifier and string `origin`. The canonical remote must match the store slug. Historical unversioned JSON remains readable. Unknown explicit identifiers fail. Identity recovery creates 