[dotfiles]
"~/.XresourceThemes" = { source = ".XresourceThemes", mode = "symlink" }
"~/.Xresources" = { source = ".Xresources", mode = "symlink" }

[tasks."xresources.bootstrap"]
run = """
if [ -n "${DISPLAY:-}" ] && command -v xrdb >/dev/null && [ -f "$HOME/.Xresources" ]; then
	xrdb -merge "$HOME/.Xresources"
fi
"""
