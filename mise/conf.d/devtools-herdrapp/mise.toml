[dotfiles]
"~/.local/bin/herdr-context" = { source = "./app/bin/herdr-context.mjs", mode = "symlink" }
"~/.config/herdr-app/mods/shared-context" = { source = "./app/mods/shared-context/", mode = "symlink" }
"~/.config/herdr-app/mods/shared-context-tabs" = { source = "./app/mods/shared-context-tabs/", mode = "symlink" }
"~/.config/herdr-app/layouts/zenobius.json" = { source = "./app/layouts/zenobius.json", mode = "symlink" }
"~/.config/herdr-app/themes/monoslate.json" = { source = "./app/themes/monoslate.json", mode = "symlink" }

"~/.config/herdr-app" = { source = "./app/preferences", mode = "symlink-each", exclude = [
  "mods/shared-context",
  "mods/shared-context-tabs",
] }
