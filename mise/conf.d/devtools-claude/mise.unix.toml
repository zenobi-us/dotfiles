[dotfiles]
"~/.claude/settings.json" = { source = "./settings.json", mode = "symlink" }
"~/.claude/statusline.sh" = { source = "./statusline.sh", mode = "symlink" }
"~/.claude/themes/" = { source = "./themes", mode = "symlink-each" }
"~/.claude/output-styles/" = { source = "./output-styles", mode = "symlink-each" }
"~/.local/bin/clip-bridge" = { source = "./clip-bridge", mode = "symlink" }

[tasks."claude.bootstrap"]
description = "Install Claude Code agent bundle plugins and their dependencies"
run = """
claude plugin marketplace add ../devtools-agent/bundles >/dev/null 2>&1 || true

for plugin in agent-core creator developer matt-pocock platform researcher writing; do
  claude plugin install "${plugin}@zenobius-agent-bundles"
done
"""
