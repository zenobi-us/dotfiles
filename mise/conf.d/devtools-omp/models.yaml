providers:
  strata:
    baseUrl: http://127.0.0.1:47831/v1
    api: openai-completions
    apiKey: "!jq -er .serving.apiKey $HOME/.strata/data/state.json"
    discovery:
      type: openai-models-list
  # Discovered llama.cpp models do not inherit the strata provider's API key.
  llama.cpp:
    baseUrl: http://127.0.0.1:8080
    api: openai-responses
    apiKey: "!jq -r .api_key $HOME/Applications/Strata/strata-iq3_xxs.json"
    discovery:
      type: llama.cpp
